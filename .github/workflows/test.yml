name: Unit Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ master ]

jobs:
  tests:
    name: Test on PHP ${{ matrix.php }}

    runs-on: ubuntu-latest
    continue-on-error: ${{ contains('8.5', matrix.php) }}
    if: "!contains(github.event.head_commit.message, '--skip ci') && !github.event.pull_request.draft"

    strategy:
      matrix:
        php:
          - '8.2'
          - '8.3'
          - '8.4'
        dependencies:
          - "lowest"
          - "highest"
        include:
          - php: '8.5'
            composer-options: "--ignore-platform-reqs"

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          ini-values: register_argc_argv=On

      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}
          composer-options: ${{ matrix.composer-options }}

      - name: Run test suite
        run: vendor/bin/phpunit --coverage-text

#      - name: Run PHPBench suite
#        run: vendor/bin/phpbench run --report=performance

  mutation:
    name: Mutation testing on PHP ${{ matrix.php }}

    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '--skip ci') && !github.event.pull_request.draft"

    strategy:
      matrix:
        # 8.2 covers the code paths without native lazy objects, 8.4 the ones with them.
        php:
          - '8.2'
          - '8.4'

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov

      - uses: ramsey/composer-install@v3

      - name: Run Infection
        run: vendor/bin/infection --threads=max --min-covered-msi=100 --show-mutations --no-progress --logger-github
